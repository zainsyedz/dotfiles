# Extra autostart processes
# exec-once = uwsm app -- my-service
exec-once = wl-clip-persist --clipboard regular # Persist clipboard after process exits (needed for codesnap on Wayland)
exec-once = wl-paste --type text --watch cliphist store # Stores only text data

exec-once = wl-paste --type image --watch cliphist store # Stores only image data

# Monitor change daemon - handles HDMI disconnect while lid closed
exec-once = ~/.config/hypr/z-scripts/monitor-daemon.sh

# Re-apply lid state on every config reload
exec = ~/.config/hypr/z-scripts/lid-switch.sh
